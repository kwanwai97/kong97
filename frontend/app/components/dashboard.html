<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Digital Twin Dashboard</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; max-width: 1200px; margin: 20px auto; padding: 0 20px; }
  button { margin: 4px; padding: 8px 12px; cursor: pointer; }
  textarea, input { margin: 4px; }
  .card { border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 6px; }
  .meta { color: #666; font-size: 0.9em; }
  .loading { color: #999; }
</style>
</head>
<body>
<h1>Digital Twin 狀態：<span id="status">檢查中...</span></h1>
<div id="brainStatus" style="margin:6px 0; color:#555;">大腦狀態：讀取中...</div>

<textarea id="inputText" rows="4" cols="100" placeholder="請輸入要分析的文本..."></textarea><br>

<button id="save">存入記憶</button>
<button id="dialectic">啟動辯證</button>
<button id="wander">夜間巡查</button>
<button id="briefing">今日簡報</button>
<button id="search">搜尋記憶</button>
<input id="searchBox" placeholder="記憶搜尋關鍵字">
<button id="align">人工智慧對齊</button>
<button id="approve">要求外部核准</button>

<hr>

<h2>辯證結果</h2>
<div id="result" style="white-space: pre-wrap; border:1px solid #ccc; padding:8px; min-height:40px;"></div>

<h2>情報摘要</h2>
<div id="briefingArea"></div>

<h2>下一步建議</h2>
<div id="nextStep" style="border:1px solid #ccc; padding:8px; min-height:40px; background:#f9f9f9;">
<p>請先輸入文字，然後按「啟動辯證」或「今日簡報」開始。</p>
</div>

<h2>系統日誌</h2>
<pre id="logs"></pre>

<script>
const inputText = document.getElementById('inputText');
const resultBox = document.getElementById('result');
const logsBox = document.getElementById('logs');
const statusEl = document.getElementById('status');
const nextStepEl = document.getElementById('nextStep');

function setStatus(s) { statusEl.textContent = s; }

async function showBrainStatus() {
  const el = document.getElementById('brainStatus');
  if (!el) return;
  try {
    const data = await api('/brain/status');
    const host = data.llm_host || '';
    const model = data.llm_model || '';
    const on = data.已啟動 ? '已啟動' : '未啟動';
    el.textContent = `大腦狀態：${on}（${model} @ ${host}）`;
    if (data.已啟動) el.style.color = '#1b5e20';
    else el.style.color = '#b71c1c';
  } catch (e) {
    el.textContent = '大腦狀態：讀取失敗';
    el.style.color = '#b71c1c';
  }
}

function log(msg) {
  const time = new Date().toLocaleTimeString('zh-TW');
  logsBox.textContent += '[' + time + '] ' + msg + '\n';
}

function showNextStep(text) {
  nextStepEl.innerHTML = '<p><b>下一步：</b>' + text + '</p>';
}

function api(path, options) {
  setStatus('處理中...');
  return fetch(path, options).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (res.status === 204) return null;
    return res.json();
  }).finally(() => {
    setStatus('就緒');
  });
}

function renderBriefing(items) {
  const area = document.getElementById('briefingArea');
  if (!area) return;
  if (!Array.isArray(items) || items.length === 0) {
    area.innerHTML = '<p>暫無情報</p>';
    showNextStep('情報暫無，你可以輸入文字做辯證分析。');
    return;
  }
  area.innerHTML = items.map(it => {
    const title = it.title || '（無標題）';
    const source = it.source || '';
    const link = it.link || '';
    const summary = it.summary || '';
    const linkHtml = link ? (' <a href="' + link + '" target="_blank">[連結]</a>') : '';
    const translatedLabel = it.translated ? '（已翻譯）' : '';
    return '<div class="card">' +
      '<b>' + title + '</b>' + linkHtml + ' <small>' + translatedLabel + '</small>' +
      '<br><small class="meta">來源：' + source + '</small>' +
      '<p>' + summary + '</p>' +
      '</div>';
  }).join('');
  showNextStep('情報已顯示。你可以：1) 輸入新文字做辯證 2) 存入記憶 3) 搜尋歷史記憶');
}

document.getElementById('save').onclick = async () => {
  const text = inputText.value.trim();
  if (!text) { alert('請先輸入文字'); return; }
  await api('/ingest', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
  log('已存入記憶');
  showNextStep('已存入記憶。下一步：按「啟動辯證」分析輸入的文字，或按「今日簡報」看情報。');
};

document.getElementById('dialectic').onclick = async () => {
  const text = inputText.value.trim();
  if (!text) { alert('請先輸入文字'); return; }
  try {
    const data = await api('/dialectic', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    const 正 = data.正方 || '';
    const 反 = data.反方 || '';
    const 整合 = data.整合結論 || '';
    if (!正 && !反 && !整合) {
      resultBox.textContent = '辯證完成，但系統暫時冇內容。請稍後再試，或Try「存入記憶」後再辯證。';
      showNextStep('辯證結果為空。建議：1) 檢查網絡連接 2) 重新輸入文字 3) 存入記憶後再試一次');
    } else {
      resultBox.textContent = '正方：' + 正 + '\n\n反方：' + 反 + '\n\n整合結論：' + 整合;
      showNextStep('辯證完成。下一步：你可以按「今日簡報」看情報，或修改輸入框內容再辯證一次。');
    }
    log('辯證完成');
  } catch (e) {
    resultBox.textContent = '辯證失敗：' + e.message;
    log('辯證失敗：' + e.message);
    showNextStep('辯證失敗。建議：1) 檢查網絡 2) 重新輸入文字 3) 重新啟動系統');
  }
};

document.getElementById('wander').onclick = async () => {
  try {
    const data = await api('/digest');
    const items = data.情報 || data.items || [];
    if (items.length === 0) {
      resultBox.textContent = '尚無情報';
      showNextStep('情報暫無。你可以：1) 按「今日簡報」再看一次 2) 輸入文字做辯證');
    } else {
      resultBox.textContent = '夜間巡查完成，共 ' + items.length + ' 則情報：\n\n' +
        items.map(it => (it.source||'') + ' - ' + (it.title||'') + '\n' + (it.summary||'')).join('\n\n');
      showNextStep('情報已顯示。下一步：按「今日簡報」看圖形化情報摘要，或按「啟動辯證」分析你輸入的文字。');
    }
    renderBriefing(items);
    log('巡邏完成');
  } catch (e) {
    resultBox.textContent = '巡邏失敗：' + e.message;
    log('巡邏失敗：' + e.message);
    showNextStep('巡邏失敗。建議：1) 檢查網絡連接 2) 重新啟動系統 3) 稍後再試');
  }
};

document.getElementById('briefing').onclick = async () => {
  try {
    const data = await api('/briefing/today');
    const items = Array.isArray(data.項目) ? data.項目 : (Array.isArray(data.items) ? data.items : []);
    if (items.length === 0) {
      resultBox.textContent = '簡報暫無內容';
      showNextStep('簡報暫無內容。你可以：1) 按「夜間巡查」抓取情報 2) 輸入文字做辯證');
    } else {
      resultBox.textContent = '簡報讀取完成，請看下方情報摘要';
      showNextStep('情報摘要已顯示。下一步：你可以閱讀情報，或按「啟動辯證」分析你輸入的文字，或「搜尋記憶」查看歷史。');
    }
    renderBriefing(items);
    log('簡報讀取完成');
  } catch (e) {
    resultBox.textContent = '簡報失敗：' + e.message;
    log('簡報失敗：' + e.message);
    showNextStep('簡報失敗。建議：1) 檢查網絡連接 2) 稍後再試 3) 按「夜間巡查」嘗試其他情報來源');
  }
};

document.getElementById('search').onclick = async () => {
  const q = document.getElementById('searchBox').value.trim();
  if (!q) { alert('請輸入搜尋關鍵字'); return; }
  try {
    const data = await api('/memory/search?查詢=' + encodeURIComponent(q));
    const results = data.結果 || data.results || [];
    if (results.length === 0) {
      resultBox.textContent = '冇找到相關記憶：' + q;
      showNextStep('搜尋無結果。建議：1) 嘗試其他關鍵字 2) 先用「存入記憶」存入一些內容');
    } else {
      resultBox.textContent = JSON.stringify(results, null, 2);
      showNextStep('搜尋完成。下一步：你可以修改搜尋詞，或按「啟動辯證」分析搜尋結果中的內容。');
    }
    log('搜尋記憶完成');
  } catch (e) {
    resultBox.textContent = '搜尋失敗：' + e.message;
    log('搜尋失敗：' + e.message);
    showNextStep('搜尋失敗。建議：1) 重新輸入關鍵字 2) 確認已存入記憶 3) 重新啟動系統');
  }
};

document.getElementById('align').onclick = async () => {
  try {
    const data = await api('/peers/align', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({a:'A', b:'B'})});
    resultBox.textContent = JSON.stringify(data, null, 2);
    showNextStep('對齊完成。這是一個測試功能，你可以按「啟動辯證」做更實用的分析。');
    log('對齊完成');
  } catch (e) {
    resultBox.textContent = '對齊失敗：' + e.message;
    log('對齊失敗：' + e.message);
    showNextStep('對齊失敗。建議：重新啟動系統或稍後再試。');
  }
};

document.getElementById('approve').onclick = async () => {
  try {
    const data = await api('/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({label:'manual-review'})});
    resultBox.textContent = JSON.stringify(data, null, 2);
    showNextStep('核准完成。這是一個測試功能，你可以返回辯證或情報功能繼續使用。');
    log('核准完成');
  } catch (e) {
    resultBox.textContent = '核准失敗：' + e.message;
    log('核准失敗：' + e.message);
    showNextStep('核准失敗。建議：重新啟動系統或稍後再試。');
  }
};

setStatus('就緒');
showBrainStatus();
</script>
</body>
</html>
